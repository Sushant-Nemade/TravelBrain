name: Automatic Maintenance Delivery
on:
  workflow_run:
    workflows: [Verify TravelBrain]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/maintenance-delivery.yml@8e801bc1cd24c74c60f921f61586e2da2b2866e6
    with:
      controller_ref: 8e801bc1cd24c74c60f921f61586e2da2b2866e6
      completed_run_id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}