name: Automatic Maintenance Delivery
on:
  workflow_run:
    workflows: [Verify TravelBrain]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/maintenance-delivery.yml@b1c6e027d62d0cec0bed167a4b0c3d5d4a8fe322
    with:
      controller_ref: b1c6e027d62d0cec0bed167a4b0c3d5d4a8fe322
      completed_run_id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}