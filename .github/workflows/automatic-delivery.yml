name: Automatic Maintenance Delivery
on:
  workflow_run:
    workflows: [Verify TravelBrain]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/maintenance-delivery.yml@5fc31e5684790f0bc7d7ba1417c1c2f2353d0880
    with:
      controller_ref: 5fc31e5684790f0bc7d7ba1417c1c2f2353d0880
      completed_run_id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}