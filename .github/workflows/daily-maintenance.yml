name: Daily Reviewed Maintenance
on:
  schedule:
    - cron: '0 12 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      pilot:
        description: Explicit manual pilot outside the shared daily selection
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  maintenance:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/portfolio-maintenance.yml@8e801bc1cd24c74c60f921f61586e2da2b2866e6
    with:
      controller_ref: 8e801bc1cd24c74c60f921f61586e2da2b2866e6
      pilot: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot }}