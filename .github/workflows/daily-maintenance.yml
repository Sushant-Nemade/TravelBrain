name: Daily Reviewed Maintenance
on:
  schedule:
    - cron: '0 12 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      pilot:
        description: Explicit manual pilot outside the shared daily selection
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  maintenance:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/portfolio-maintenance.yml@b1c6e027d62d0cec0bed167a4b0c3d5d4a8fe322
    with:
      controller_ref: b1c6e027d62d0cec0bed167a4b0c3d5d4a8fe322
      pilot: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot }}