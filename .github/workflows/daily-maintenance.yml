name: Daily Reviewed Maintenance
on:
  schedule:
    - cron: '0 12 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      pilot:
        description: Explicit manual pilot outside the shared daily selection
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  maintenance:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/portfolio-maintenance.yml@5fc31e5684790f0bc7d7ba1417c1c2f2353d0880
    with:
      controller_ref: 5fc31e5684790f0bc7d7ba1417c1c2f2353d0880
      pilot: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot }}