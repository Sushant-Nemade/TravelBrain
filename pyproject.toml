[project]
name = "travelbrain-workbench"
version = "0.2.1"
description = "Source-linked trip planning with private persistence and optional grounded AI"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "fastapi>=0.143.3,<0.144",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.14.1,<3",
    "uvicorn>=0.54,<0.55",
]

[project.scripts]
travelbrain = "src.web:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16", "build>=1.4,<2", "twine>=6,<7", "pip-audit>=2.10,<3"]

[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
include-package-data = false

[tool.setuptools.package-data]
src = ["site/**/*", "site/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110
include = ["src/contracts.py", "src/catalog.py", "src/planner.py", "src/store.py", "src/providers.py", "src/web.py", "tests/*.py", "scripts/build_site.py"]
